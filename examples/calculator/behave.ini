[behave]
jobs = 4
runner = behave_pool:ParallelRunner

; Pool-specific options for the plain "behave" command go in userdata
; (they are resolved when the runner initialises). With the
; "behave-pool" command you can use the native keys instead:
;   parallel_balance = lpt
;   parallel_report = behave-pool-report.json
[behave.userdata]
pool.balance = lpt
pool.report = behave-pool-report.json
