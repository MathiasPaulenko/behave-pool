[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "behave-pool"
version = "1.3.0"
description = "Parallel test execution for Behave BDD via native ITestRunner."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mathias Paulenko", email = "mathias.paulenko@outlook.com" }]
keywords = ["behave", "bdd", "parallel", "multiprocessing", "testing", "runner"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: BDD",
    "Typing :: Typed",
]
dependencies = ["behave>=1.3.0"]

[project.optional-dependencies]
ecosystem = [
    "behave-priority>=1.0",
    "behave-modern-json-report>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.0",
    "pre-commit>=3.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Documentation = "https://mathiaspaulenko.github.io/behave-pool/"
Homepage = "https://github.com/MathiasPaulenko/behave-pool"
Repository = "https://github.com/MathiasPaulenko/behave-pool"
Issues = "https://github.com/MathiasPaulenko/behave-pool/issues"
Changelog = "https://github.com/MathiasPaulenko/behave-pool/blob/main/CHANGELOG.md"

[project.scripts]
behave-pool = "behave_pool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["behave_pool"]

[tool.hatch.build.targets.wheel.force-include]
"behave_pool/py.typed" = "behave_pool/py.typed"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["behave_pool"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["behave_pool"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
